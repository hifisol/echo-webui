{% extends "base.html" %}
{% block title %}ECHO - Spectrum{% endblock %}
{% block content %}
<div class="topbar">
  <h2>RF Spectrum</h2>
  <div class="topbar-actions">
    <button class="btn btn-primary" id="btn-start-sdr">Start Sweep</button>
    <button class="btn" hx-post="/sdr/api/stop" hx-target="#sdr-status" hx-swap="innerHTML">Stop</button>
  </div>
</div>

<div id="sdr-status"></div>

<div class="card">
  <div class="card-header">
    <h3>Frequency Presets</h3>
  </div>
  <div class="card-body" style="display:flex;gap:8px;flex-wrap:wrap;">
    {% for key, preset in presets.items() %}
    <button class="btn btn-sm preset-btn" data-preset="{{ key }}"
            onclick="selectPreset('{{ key }}', '{{ preset.start }}', '{{ preset.end }}', '{{ preset.bin }}')">
      {{ preset.label }}
    </button>
    {% endfor %}
  </div>
</div>

<div class="grid-3" style="margin-bottom:16px;">
  <div class="form-group">
    <label>Start Frequency</label>
    <input type="text" id="freq-start" name="freq_start" value="2.4G" style="width:100%">
  </div>
  <div class="form-group">
    <label>End Frequency</label>
    <input type="text" id="freq-end" name="freq_end" value="2.5G" style="width:100%">
  </div>
  <div class="form-group">
    <label>Bin Size</label>
    <input type="text" id="bin-size" name="bin_size" value="1M" style="width:100%">
  </div>
</div>

<div class="card">
  <div class="card-header"><h3>Spectrum</h3></div>
  <div class="card-body">
    <canvas id="spectrum-canvas" height="200"></canvas>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3>Waterfall</h3></div>
  <div class="card-body">
    <canvas id="waterfall-canvas" height="300"></canvas>
  </div>
</div>

<script>
function selectPreset(key, start, end, bin) {
  document.getElementById('freq-start').value = start;
  document.getElementById('freq-end').value = end;
  document.getElementById('bin-size').value = bin;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('btn-primary'));
  document.querySelector('[data-preset="'+key+'"]').classList.add('btn-primary');
}

document.getElementById('btn-start-sdr').addEventListener('click', function() {
  var form = new FormData();
  form.append('freq_start', document.getElementById('freq-start').value);
  form.append('freq_end', document.getElementById('freq-end').value);
  form.append('bin_size', document.getElementById('bin-size').value);
  fetch('/sdr/api/start', { method: 'POST', body: form })
    .then(r => r.text())
    .then(html => document.getElementById('sdr-status').innerHTML = html);
});
</script>
{% endblock %}
{% block scripts %}
<script src="/static/js/spectrum.js"></script>
{% endblock %}
