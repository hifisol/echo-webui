<div class="card-body">
  {% if not readonly %}
  <form hx-post="/mesh/api/config" hx-target="#config-status" hx-swap="innerHTML">
    <div class="grid-3">
      <div class="form-group">
        <label>Device Name</label>
        <input type="text" name="name" value="{{ config.get('name', '') }}" placeholder="Node name" style="width:100%">
      </div>
      <div class="form-group">
        <label>TX Power</label>
        <input type="number" name="tx_power" value="{{ config.get('tx_power', '') }}" placeholder="e.g. 20" style="width:100%">
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end">
        <button type="submit" class="btn btn-primary">Update Config</button>
      </div>
    </div>
  </form>
  <div id="config-status" style="margin-top:8px"></div>
  {% endif %}

  <div style="{% if not readonly %}margin-top:20px;border-top:1px solid var(--border);padding-top:16px{% endif %}">
    <h4 style="margin-bottom:12px;color:var(--steel)">Device State</h4>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Key</th><th>Value</th></tr></thead>
        <tbody>
          {% for k, v in config.items() %}
          <tr>
            <td class="mono" style="color:var(--copper)">{{ k }}</td>
            <td>{{ v or '-' }}</td>
          </tr>
          {% else %}
          <tr><td colspan="2" style="color:var(--text-dim);text-align:center;padding:16px">No device state available{% if not readonly %}. Connect first{% endif %}.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  {% if not readonly %}
  <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
    <h4 style="margin-bottom:12px;color:var(--steel)">Network Actions</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" hx-post="/mesh/api/advertise" hx-vals='{"flood":"0"}' hx-target="#config-status">Send Advert</button>
      <button class="btn btn-sm" hx-post="/mesh/api/advertise" hx-vals='{"flood":"1"}' hx-target="#config-status">Flood Advert</button>
      <button class="btn btn-sm" hx-post="/mesh/api/refresh_contacts" hx-target="#config-status">Refresh Contacts</button>
    </div>
  </div>
  {% endif %}
</div>
