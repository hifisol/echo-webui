<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Tool</th>
      <th>Status</th>
      <th>Started</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for job in jobs %}
    <tr>
      <td class="mono" style="font-size:11px;">{{ job.id }}</td>
      <td><span class="badge badge-wpa2">{{ job.tool }}</span></td>
      <td>
        <span class="status-dot {{ job.status }}"></span>
        {{ job.status }}
      </td>
      <td style="font-size:11px;color:var(--text-dim)">
        {% if job.started_at %}{{ job.started_at }}{% else %}-{% endif %}
      </td>
      <td>
        <button class="btn btn-sm" hx-get="/jobs/api/{{ job.id }}" hx-target="#job-output" hx-swap="innerHTML">View</button>
        {% if job.status == 'running' %}
        <button class="btn btn-sm btn-danger" hx-post="/jobs/api/{{ job.id }}/cancel" hx-target="#job-list" hx-swap="innerHTML"
                hx-confirm="Cancel this job?">Cancel</button>
        {% endif %}
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:24px;">No jobs.</td></tr>
    {% endfor %}
  </tbody>
</table>
